<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Vetchalabs Wallpaper Studio - Minimal Working Version</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body.light-theme {
      --bg: #f8fafc;
      --card-bg: #e2e8f0;
      --accent: #0284c7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s, color 0.3s;
      position: relative;
    }
    .container { width: 100%; max-width: 860px; }
    header { text-align: center; margin-bottom: 1.25rem; }
    h1 { margin: 0 0 0.3rem; font-size: 1.5rem; }
    p { color: var(--muted); margin: 0; font-size: 0.85rem; }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .preset-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .preset-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .preset-group label { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .badge {
      font-size: 0.75rem;
      background: #0284c722;
      color: var(--accent);
      border: 1px solid #0284c744;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .file-label {
      display: block;
      border: 2px dashed var(--border);
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    .file-label:hover { border-color: var(--accent); }
    input[type="file"] { display: none; }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .batch-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .btn {
      background: var(--accent);
      color: #0b0f19;
      font-weight: 600;
      border: none;
      padding: 0.55rem 0.95rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn:disabled { background: var(--border); cursor: not-allowed; }
    .btn-secondary { background: var(--border); color: var(--text); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.85rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .card canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 5;
      object-fit: contain;
      border-radius: 4px;
      background: #000;
    }
    .card span {
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
    }
    .card-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.35rem; width: 100%; }
    .card-actions .btn { min-width: 0; width: 100%; padding: 0.4rem 0.25rem; font-size: 0.72rem; white-space: normal; line-height: 1.1; }
    .modal { display: none; position: fixed; inset: 0; background: #0009; z-index: 10; padding: 1rem; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; width: min(100%, 420px); }
    .modal-content h2 { margin: 0 0 0.75rem; font-size: 1.1rem; }
    .modal-content textarea { width: 100%; min-height: 90px; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; font: inherit; }
    .device-info { color: var(--muted); font-size: 0.78rem; margin: -0.35rem 0 0.75rem; }
    .edit-preview { display: block; width: 100%; max-height: 45vh; object-fit: contain; background: #000; margin-bottom: 0.75rem; }
    .edit-preview { touch-action: none; cursor: grab; }
    .edit-preview:active { cursor: grabbing; }
    .control { display: grid; grid-template-columns: 90px 1fr 42px; align-items: center; gap: 0.5rem; margin: 0.55rem 0; font-size: 0.8rem; }
    .control output { text-align: right; color: var(--muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">☀️</button>
    
    <header>
      <h1>Vetchalabs Wallpaper Studio</h1>
      <p>Fine-tuned wallpapers with hardware-specific color profiles & dithering</p>
    </header>

    <div class="preset-bar">
      <div class="preset-group">
        <label for="devicePreset">Target Device:</label>
        <select id="devicePreset">
          <option value="xteink">Xteink X4 (480 × 800 · 4-Gray BMP)</option>
          <option value="kindle">Kindle Paperwhite (1264 × 1680 · 16-Gray PNG)</option>
          <option value="applewatch">Apple Watch 45mm/Ultra (410 × 502 · OLED PNG)</option>
        </select>
      </div>
      <span class="badge" id="specBadge">480 × 800 • 4-Level BMP</span>
    </div>

    <label class="file-label" for="fileInput">
      <div style="font-size: 1.5rem;">➕ 📷</div>
      <strong>Add Photos from Gallery</strong>
      <p style="margin-top: 0.2rem;">Multi-selection supported</p>
      <input type="file" id="fileInput" multiple accept="image/*" />
    </label>

    <div class="actions">
      <span id="counter" style="color: var(--muted); font-size: 0.85rem;">0 wallpapers</span>
      <div class="batch-actions">
        <button class="btn btn-secondary" id="selectAllBtn" disabled>Select All</button>
        <button class="btn btn-secondary" id="deselectAllBtn" disabled>Deselect All</button>
        <button class="btn btn-secondary" id="applyPresetBtn" disabled>Apply Preset</button>
        <button class="btn btn-secondary" id="clearAllBtn" disabled>Clear All</button>
        <button class="btn" id="downloadZipBtn" disabled>Download ZIP</button>
      </div>
    </div>

    <div class="grid" id="previewGrid"></div>
  </div>

  <div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal-content">
      <h2 id="editTitle">Edit wallpaper</h2>
      <p class="device-info" id="editDeviceInfo"></p>
      <canvas class="edit-preview" id="editCanvas"></canvas>
      <label class="control">Zoom <input id="editZoom" type="range" min="1" max="2" step="0.01" value="1"><output id="editZoomValue">1.00</output></label>
      <label class="control">Contrast <input id="editContrast" type="range" min="0.5" max="2" step="0.05" value="1"><output id="editContrastValue">1.00</output></label>
      <label class="control">Brightness <input id="editBrightness" type="range" min="-100" max="100" value="0"><output id="editBrightnessValue">0</output></label>
      <label class="control">Dither <select id="editDither"><option value="fs">Floyd-Steinberg</option><option value="none">None</option></select><output></output></label>
      <label class="control">Preset <select id="presetSelect"><option value="">None</option><option value="high-contrast">High Contrast</option><option value="natural">Natural</option><option value="vivid-dither">Vivid Dither</option><option value="soft">Soft</option></select><output></output></label>
      <div class="modal-actions"><input id="presetName" placeholder="Custom preset name" style="flex:1; min-width:0; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:0.45rem"><button class="btn btn-secondary" id="savePreset">Save Preset</button></div>
      <div class="modal-actions"><button class="btn btn-secondary" id="cancelEdit">Cancel</button><button class="btn" id="applyEdit">Apply</button></div>
    </div>
  </div>

  <div class="modal" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="modal-content">
      <h2 id="shareTitle">Share wallpaper</h2>
      <textarea id="shareMessage" maxlength="200" placeholder="Add your message here (optional)..."></textarea>
      <p id="shareCount" class="device-info">0/200 characters</p>
      <div class="modal-actions"><button class="btn" id="shareWhatsapp">WhatsApp</button><button class="btn" id="shareEmail">Email</button><button class="btn" id="shareCopy">Copy</button></div>
      <div class="modal-actions"><button class="btn btn-secondary" id="closeShare">Close</button></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    console.log("App starting...");

    // ========== THEME MANAGEMENT ==========
    const themeToggle = document.getElementById('themeToggle');
    const counter = document.getElementById('counter');
    const fileInput = document.getElementById('fileInput');
    const previewGrid = document.getElementById('previewGrid');
    const devicePreset = document.getElementById('devicePreset');
    const specBadge = document.getElementById('specBadge');
    const editModal = document.getElementById('editModal');
    const editCanvas = document.getElementById('editCanvas');
    const editZoom = document.getElementById('editZoom');
    const editContrast = document.getElementById('editContrast');
    const editBrightness = document.getElementById('editBrightness');
    const editDither = document.getElementById('editDither');
    const presetSelect = document.getElementById('presetSelect');
    const presetName = document.getElementById('presetName');
    const shareModal = document.getElementById('shareModal');
    const shareMessage = document.getElementById('shareMessage');
    const shareCount = document.getElementById('shareCount');
    const selectedItems = new Set();
    const DEFAULT_PRESETS = {
      'high-contrast': { zoom: 1, contrast: 1.8, brightness: 5, dither: 'fs' },
      natural: { zoom: 1, contrast: 1.15, brightness: 0, dither: 'fs' },
      'vivid-dither': { zoom: 1, contrast: 1.5, brightness: 10, dither: 'fs' },
      soft: { zoom: 1, contrast: 0.9, brightness: -10, dither: 'none' }
    };
    const selectAllBtn = document.getElementById('selectAllBtn');
    const deselectAllBtn = document.getElementById('deselectAllBtn');
    const applyPresetBtn = document.getElementById('applyPresetBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const downloadZipBtn = document.getElementById('downloadZipBtn');
    const activeEditTitle = document.getElementById('editTitle');
    const editDeviceInfo = document.getElementById('editDeviceInfo');
    let activeItem = null;
    const deviceSpecs = {
      xteink: { width: 480, height: 800, badge: '480 × 800 • 4-Level BMP', ext: 'bmp', mode: 'gray4' },
      kindle: { width: 1264, height: 1680, badge: '1264 × 1680 • 16-Level PNG', ext: 'png', mode: 'gray16' },
      applewatch: { width: 410, height: 502, badge: '410 × 502 • OLED PNG', ext: 'png', mode: 'color' }
    };
    
    function initTheme() {
      const savedTheme = localStorage.getItem('ditherdeck-theme') || 'dark';
      document.body.classList.toggle('light-theme', savedTheme === 'light');
      updateThemeToggleButton(savedTheme);
    }
    
    function updateThemeToggleButton(theme) {
      themeToggle.textContent = theme === 'light' ? '🌙' : '☀️';
      themeToggle.title = theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme';
    }
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = localStorage.getItem('ditherdeck-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.classList.toggle('light-theme', newTheme === 'light');
      localStorage.setItem('ditherdeck-theme', newTheme);
      updateThemeToggleButton(newTheme);
    });
    
    initTheme();
    console.log("Theme initialized");
    
    // ========== IMAGE LOADING ==========
    let items = [];

    function loadPresets() {
      try { return { ...DEFAULT_PRESETS, ...JSON.parse(localStorage.getItem('ditherdeck-presets') || '{}') }; }
      catch { return { ...DEFAULT_PRESETS }; }
    }

    Object.keys(loadPresets()).filter(name => !DEFAULT_PRESETS[name]).forEach(name => {
      const option = document.createElement('option');
      option.value = name; option.textContent = name;
      presetSelect.appendChild(option);
    });

    function saveCustomPreset(name, params) {
      const saved = JSON.parse(localStorage.getItem('ditherdeck-presets') || '{}');
      saved[name] = params;
      localStorage.setItem('ditherdeck-presets', JSON.stringify(saved));
      const option = document.createElement('option');
      option.value = name; option.textContent = name;
      presetSelect.appendChild(option); presetSelect.value = name;
    }

    function updateBatchUI() {
      const hasItems = items.length > 0;
      selectAllBtn.disabled = !hasItems;
      deselectAllBtn.disabled = selectedItems.size === 0;
      applyPresetBtn.disabled = selectedItems.size === 0;
      clearAllBtn.disabled = !hasItems;
      downloadZipBtn.disabled = !hasItems;
      counter.textContent = `${items.length} wallpaper(s)${selectedItems.size ? ` (${selectedItems.size} selected)` : ''} ready`;
      items.forEach(item => item.checkbox && (item.checkbox.checked = selectedItems.has(item.id)));
    }

    function applyEditorPreset(params) {
      const safeParams = {
        contrast: Number.isFinite(Number(params && params.contrast)) ? Number(params.contrast) : 1.15,
        brightness: Number.isFinite(Number(params && params.brightness)) ? Number(params.brightness) : 0,
        dither: params && params.dither === 'none' ? 'none' : 'fs'
      };
      editContrast.value = safeParams.contrast;
      editBrightness.value = safeParams.brightness;
      editDither.value = safeParams.dither;
      updateEditorPreview();
    }

    function drawItem(item, canvas, params) {
      const spec = deviceSpecs[devicePreset.value];
      canvas.width = spec.width;
      canvas.height = spec.height;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(spec.width / item.img.width, spec.height / item.img.height) * params.zoom;
      const x = (spec.width - item.img.width * scale) / 2 + (params.panX || 0);
      const y = (spec.height - item.img.height * scale) / 2 + (params.panY || 0);
      ctx.drawImage(item.img, x, y, item.img.width * scale, item.img.height * scale);
      applyDeviceTransform(ctx, spec, params);
    }

    function applyDeviceTransform(ctx, spec, params) {
      const image = ctx.getImageData(0, 0, spec.width, spec.height);
      const pixels = image.data;
      const contrast = Number.isFinite(Number(params.contrast)) ? Number(params.contrast) : 1;
      const brightness = Number.isFinite(Number(params.brightness)) ? Number(params.brightness) : 0;

      if (spec.mode === 'color') {
        for (let i = 0; i < pixels.length; i += 4) {
          for (let channel = 0; channel < 3; channel++) {
            const adjusted = ((pixels[i + channel] - 128) * contrast) + 128 + brightness;
            pixels[i + channel] = Math.max(0, Math.min(255, Math.round(adjusted)));
          }
        }
        ctx.putImageData(image, 0, 0);
        return;
      }

      const gray = new Float32Array(spec.width * spec.height);
      const levels = spec.mode === 'gray4' ? 4 : 16;
      for (let i = 0; i < gray.length; i++) {
        const p = i * 4;
        const luminance = 0.299 * pixels[p] + 0.587 * pixels[p + 1] + 0.114 * pixels[p + 2];
        gray[i] = Math.max(0, Math.min(255, ((luminance - 128) * contrast) + 128 + brightness));
      }
      for (let y = 0; y < spec.height; y++) {
        for (let x = 0; x < spec.width; x++) {
          const index = y * spec.width + x;
          const oldValue = Math.max(0, Math.min(255, gray[index]));
          const quantized = Math.round(oldValue / 255 * (levels - 1)) * 255 / (levels - 1);
          gray[index] = quantized;
          if (params.dither === 'fs') {
            const error = oldValue - quantized;
            if (x + 1 < spec.width) gray[index + 1] += error * 7 / 16;
            if (x > 0 && y + 1 < spec.height) gray[index + spec.width - 1] += error * 3 / 16;
            if (y + 1 < spec.height) gray[index + spec.width] += error * 5 / 16;
            if (x + 1 < spec.width && y + 1 < spec.height) gray[index + spec.width + 1] += error / 16;
          }
        }
      }
      for (let i = 0; i < gray.length; i++) {
        const p = i * 4;
        const value = Math.max(0, Math.min(255, Math.round(gray[i])));
        pixels[p] = value; pixels[p + 1] = value; pixels[p + 2] = value; pixels[p + 3] = 255;
      }
      ctx.putImageData(image, 0, 0);
    }

    function redrawItem(item) {
      const spec = deviceSpecs[devicePreset.value];
      item.canvas.style.aspectRatio = `${spec.width} / ${spec.height}`;
      drawItem(item, item.canvas, item.params);
    }

    function create24BitBMP(rgbaData, width, height) {
      const rowSize = Math.floor((24 * width + 31) / 32) * 4;
      const pixelSize = rowSize * height;
      const buffer = new ArrayBuffer(54 + pixelSize);
      const view = new DataView(buffer);
      view.setUint16(0, 0x4d42, false);
      view.setUint32(2, 54 + pixelSize, true);
      view.setUint32(10, 54, true);
      view.setUint32(14, 40, true);
      view.setInt32(18, width, true);
      view.setInt32(22, height, true);
      view.setUint16(26, 1, true);
      view.setUint16(28, 24, true);
      view.setUint32(34, pixelSize, true);
      let offset = 54;
      for (let y = height - 1; y >= 0; y--) {
        for (let x = 0; x < width; x++) {
          const source = (y * width + x) * 4;
          view.setUint8(offset++, rgbaData[source + 2]);
          view.setUint8(offset++, rgbaData[source + 1]);
          view.setUint8(offset++, rgbaData[source]);
        }
        while (offset % 4 !== 2) view.setUint8(offset++, 0);
      }
      return new Blob([buffer], { type: 'image/bmp' });
    }

    function saveItem(item) {
      const spec = deviceSpecs[devicePreset.value];
      const baseName = item.filename.replace(/\.[^/.]+$/, '');
      const download = blob => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${baseName}.${spec.ext}`;
        link.click();
        URL.revokeObjectURL(link.href);
      };
      if (spec.mode === 'gray4') {
        download(create24BitBMP(item.canvas.getContext('2d').getImageData(0, 0, spec.width, spec.height).data, spec.width, spec.height));
      } else {
        item.canvas.toBlob(download, 'image/png');
      }
    }

    function openEditor(item) {
      activeItem = item;
      const spec = deviceSpecs[devicePreset.value];
      activeEditTitle.textContent = `Edit ${item.filename}`;
      editDeviceInfo.textContent = `${devicePreset.options[devicePreset.selectedIndex].text} | ${spec.width} × ${spec.height} | Defaults: zoom 1.00, contrast 1.00, brightness 0`;
      editZoom.value = item.params.zoom;
      editContrast.value = item.params.contrast;
      editBrightness.value = item.params.brightness;
      editDither.value = item.params.dither;
      presetSelect.value = '';
      updateEditorPreview();
      editModal.classList.add('active');
    }

    function updateEditorPreview() {
      if (!activeItem) return;
      drawItem(activeItem, editCanvas, { zoom: Number(editZoom.value), contrast: Number(editContrast.value), brightness: Number(editBrightness.value), dither: editDither.value, panX: activeItem.params.panX, panY: activeItem.params.panY });
      document.getElementById('editZoomValue').textContent = Number(editZoom.value).toFixed(2);
      document.getElementById('editContrastValue').textContent = Number(editContrast.value).toFixed(2);
      document.getElementById('editBrightnessValue').textContent = editBrightness.value;
    }

    [editZoom, editContrast, editBrightness].forEach(input => input.addEventListener('input', updateEditorPreview));
    editDither.addEventListener('change', updateEditorPreview);
    presetSelect.addEventListener('change', () => {
      if (presetSelect.value) applyEditorPreset(loadPresets()[presetSelect.value]);
    });
    document.getElementById('savePreset').addEventListener('click', () => {
      const name = presetName.value.trim();
      if (!name) return;
      saveCustomPreset(name, { zoom: Number(editZoom.value), contrast: Number(editContrast.value), brightness: Number(editBrightness.value), dither: editDither.value });
      presetName.value = '';
    });
    let isPanning = false;
    let lastPointer = null;
    editCanvas.addEventListener('pointerdown', event => {
      isPanning = true;
      lastPointer = event;
      editCanvas.setPointerCapture(event.pointerId);
    });
    editCanvas.addEventListener('pointermove', event => {
      if (!isPanning || !activeItem) return;
      const rect = editCanvas.getBoundingClientRect();
      activeItem.params.panX += (event.clientX - lastPointer.clientX) * deviceSpecs[devicePreset.value].width / rect.width;
      activeItem.params.panY += (event.clientY - lastPointer.clientY) * deviceSpecs[devicePreset.value].height / rect.height;
      lastPointer = event;
      updateEditorPreview();
    });
    editCanvas.addEventListener('pointerup', () => { isPanning = false; lastPointer = null; });
    document.getElementById('cancelEdit').addEventListener('click', () => editModal.classList.remove('active'));
    document.getElementById('applyEdit').addEventListener('click', () => {
      if (!activeItem) return;
      activeItem.params = { ...activeItem.params, zoom: Number(editZoom.value), contrast: Number(editContrast.value), brightness: Number(editBrightness.value), dither: editDither.value };
      redrawItem(activeItem);
      editModal.classList.remove('active');
    });

    devicePreset.addEventListener('change', () => {
      const spec = deviceSpecs[devicePreset.value];
      specBadge.textContent = spec.badge;
      items.forEach(item => {
        redrawItem(item);
        const saveButton = item.card.querySelector('.save-button');
        saveButton.textContent = `Save .${spec.ext.toUpperCase()}`;
      });
    });
    
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        
        const img = new Image();
        img.onload = () => {
          const item = {
            id: 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
            filename: file.name,
            img: img,
            params: { zoom: 1, panX: 0, panY: 0, contrast: 1.15, brightness: 0, dither: 'fs' }
          };
          
          const canvas = document.createElement('canvas');
          item.canvas = canvas;
          canvas.style.aspectRatio = `${deviceSpecs[devicePreset.value].width} / ${deviceSpecs[devicePreset.value].height}`;
          drawItem(item, canvas, item.params);
          
          const card = document.createElement('div');
          card.className = 'card';
          card.appendChild(canvas);

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.title = 'Select wallpaper';
          checkbox.addEventListener('change', () => {
            if (checkbox.checked) selectedItems.add(item.id); else selectedItems.delete(item.id);
            updateBatchUI();
          });
          item.checkbox = checkbox;
          
          const label = document.createElement('span');
          label.textContent = file.name;
          card.appendChild(label);

          const cardActions = document.createElement('div');
          cardActions.className = 'card-actions';
          card.appendChild(checkbox);
          const editButton = document.createElement('button');
          editButton.className = 'btn';
          editButton.textContent = '✏️ Edit';
          editButton.type = 'button';
          editButton.addEventListener('click', () => openEditor(item));
          cardActions.appendChild(editButton);
          const saveButton = document.createElement('button');
          saveButton.className = 'btn btn-secondary';
          saveButton.classList.add('save-button');
          saveButton.textContent = `Save .${deviceSpecs[devicePreset.value].ext.toUpperCase()}`;
          saveButton.type = 'button';
          saveButton.addEventListener('click', () => saveItem(item));
          cardActions.appendChild(saveButton);
          const shareButton = document.createElement('button');
          shareButton.className = 'btn btn-secondary'; shareButton.textContent = 'Share'; shareButton.type = 'button';
          shareButton.addEventListener('click', () => openShare(item));
          cardActions.appendChild(shareButton);
          const deleteButton = document.createElement('button');
          deleteButton.className = 'btn btn-secondary'; deleteButton.textContent = 'Delete'; deleteButton.type = 'button';
          deleteButton.addEventListener('click', () => removeItem(item));
          cardActions.appendChild(deleteButton);
          item.card = card;
          card.appendChild(cardActions);
          
          previewGrid.appendChild(card);
          items.push(item);
          updateBatchUI();
        };
        img.onerror = () => {
          console.error('Failed to load image:', file.name);
        };
        img.src = URL.createObjectURL(file);
      }
      fileInput.value = '';
    });

    function removeItem(item) {
      item.card.remove();
      items = items.filter(candidate => candidate !== item);
      selectedItems.delete(item.id);
      updateBatchUI();
    }

    selectAllBtn.addEventListener('click', () => {
      items.forEach(item => selectedItems.add(item.id));
      updateBatchUI();
    });
    deselectAllBtn.addEventListener('click', () => {
      selectedItems.clear(); updateBatchUI();
    });
    clearAllBtn.addEventListener('click', () => {
      items.forEach(item => item.card.remove());
      items = []; selectedItems.clear(); updateBatchUI();
    });
    applyPresetBtn.addEventListener('click', async () => {
      const name = prompt('Preset name:');
      if (!name || !loadPresets()[name]) return;
      const rawParams = loadPresets()[name];
      const params = {
        contrast: Number.isFinite(Number(rawParams.contrast)) ? Number(rawParams.contrast) : 1.15,
        brightness: Number.isFinite(Number(rawParams.brightness)) ? Number(rawParams.brightness) : 0,
        dither: rawParams.dither === 'none' ? 'none' : 'fs'
      };
      for (const item of items.filter(candidate => selectedItems.has(candidate.id))) {
        item.params = { ...item.params, ...params };
        redrawItem(item);
      }
    });
    downloadZipBtn.addEventListener('click', async () => {
      if (!window.JSZip) return;
      const zip = new JSZip();
      const folder = zip.folder(devicePreset.value);
      for (const item of items) {
        const filename = `${item.filename.replace(/\.[^/.]+$/, '')}.${deviceSpecs[devicePreset.value].ext}`;
        folder.file(filename, await getExportBlob(item));
      }
      const blob = await zip.generateAsync({ type: 'blob' });
      downloadBlob(blob, 'ditherdeck-wallpapers.zip');
    });

    function getExportBlob(item) {
      const spec = deviceSpecs[devicePreset.value];
      if (spec.mode === 'gray4') return create24BitBMP(item.canvas.getContext('2d').getImageData(0, 0, spec.width, spec.height).data, spec.width, spec.height);
      return new Promise(resolve => item.canvas.toBlob(resolve, 'image/png'));
    }
    function downloadBlob(blob, filename) {
      const link = document.createElement('a');
      link.href = typeof blob === 'string' ? blob : URL.createObjectURL(blob);
      link.download = filename; link.click();
      if (typeof blob !== 'string') URL.revokeObjectURL(link.href);
    }
    function openShare(item) {
      activeItem = item; shareMessage.value = ''; shareCount.textContent = '0/200 characters'; shareModal.classList.add('active');
    }
    function shareText() {
      const message = shareMessage.value.trim();
      const link = `${window.location.origin}${window.location.pathname}?device=${devicePreset.value}`;
      return message ? `${message}\n\nMade with DitherDeck\n${link}` : `Check out my e-ink wallpaper made with DitherDeck!\n${link}`;
    }
    shareMessage.addEventListener('input', () => { shareCount.textContent = `${shareMessage.value.length}/200 characters`; });
    document.getElementById('closeShare').addEventListener('click', () => shareModal.classList.remove('active'));
    document.getElementById('shareWhatsapp').addEventListener('click', () => window.open(`https://wa.me/?text=${encodeURIComponent(shareText())}`, '_blank'));
    document.getElementById('shareEmail').addEventListener('click', () => window.open(`mailto:?subject=${encodeURIComponent('My DitherDeck wallpaper')}&body=${encodeURIComponent(shareText())}`));
    document.getElementById('shareCopy').addEventListener('click', async () => {
      await navigator.clipboard.writeText(shareText());
      shareModal.classList.remove('active');
    });
    
    console.log("App fully initialized - theme toggle and image loading ready!");
  </script>
</body>
</html>
