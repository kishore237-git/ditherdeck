<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Vetchalabs Wallpaper Studio - Minimal Working Version</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body.light-theme {
      --bg: #f8fafc;
      --card-bg: #e2e8f0;
      --accent: #0284c7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s, color 0.3s;
      position: relative;
    }
    .container { width: 100%; max-width: 860px; }
    header { text-align: center; margin-bottom: 1.25rem; }
    h1 { margin: 0 0 0.3rem; font-size: 1.5rem; }
    p { color: var(--muted); margin: 0; font-size: 0.85rem; }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .preset-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .preset-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .preset-group label { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .badge {
      font-size: 0.75rem;
      background: #0284c722;
      color: var(--accent);
      border: 1px solid #0284c744;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .file-label {
      display: block;
      border: 2px dashed var(--border);
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    .file-label:hover { border-color: var(--accent); }
    input[type="file"] { display: none; }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--accent);
      color: #0b0f19;
      font-weight: 600;
      border: none;
      padding: 0.55rem 0.95rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn:disabled { background: var(--border); cursor: not-allowed; }
    .btn-secondary { background: var(--border); color: var(--text); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.85rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .card canvas {
      width: 100%;
      height: 140px;
      border-radius: 4px;
      background: #000;
    }
    .card span {
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">☀️</button>
    
    <header>
      <h1>Vetchalabs Wallpaper Studio</h1>
      <p>Fine-tuned wallpapers with hardware-specific color profiles & dithering</p>
    </header>

    <div class="preset-bar">
      <div class="preset-group">
        <label for="devicePreset">Target Device:</label>
        <select id="devicePreset">
          <option value="xteink">Xteink X4 (480 × 800 · 4-Gray BMP)</option>
          <option value="kindle">Kindle Paperwhite (1264 × 1680 · 16-Gray PNG)</option>
          <option value="applewatch">Apple Watch 45mm/Ultra (410 × 502 · OLED PNG)</option>
        </select>
      </div>
      <span class="badge" id="specBadge">480 × 800 • 4-Level BMP</span>
    </div>

    <label class="file-label" for="fileInput">
      <div style="font-size: 1.5rem;">➕ 📷</div>
      <strong>Add Photos from Gallery</strong>
      <p style="margin-top: 0.2rem;">Multi-selection supported</p>
      <input type="file" id="fileInput" multiple accept="image/*" />
    </label>

    <div class="actions">
      <span id="counter" style="color: var(--muted); font-size: 0.85rem;">0 wallpapers</span>
    </div>

    <div class="grid" id="previewGrid"></div>
  </div>

  <script>
    console.log("App starting...");

    // ========== THEME MANAGEMENT ==========
    const themeToggle = document.getElementById('themeToggle');
    const counter = document.getElementById('counter');
    const fileInput = document.getElementById('fileInput');
    const previewGrid = document.getElementById('previewGrid');
    
    function initTheme() {
      const savedTheme = localStorage.getItem('ditherdeck-theme') || 'dark';
      document.body.classList.toggle('light-theme', savedTheme === 'light');
      updateThemeToggleButton(savedTheme);
    }
    
    function updateThemeToggleButton(theme) {
      themeToggle.textContent = theme === 'light' ? '🌙' : '☀️';
      themeToggle.title = theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme';
    }
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = localStorage.getItem('ditherdeck-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.classList.toggle('light-theme', newTheme === 'light');
      localStorage.setItem('ditherdeck-theme', newTheme);
      updateThemeToggleButton(newTheme);
    });
    
    initTheme();
    console.log("Theme initialized");
    
    // ========== IMAGE LOADING ==========
    let items = [];
    
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        
        const img = new Image();
        img.onload = () => {
          const item = {
            id: 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
            filename: file.name,
            img: img
          };
          
          const canvas = document.createElement('canvas');
          canvas.width = 480;
          canvas.height = 800;
          const ctx = canvas.getContext('2d');
          
          const scale = Math.max(480 / img.width, 800 / img.height);
          const x = (480 - img.width * scale) / 2;
          const y = (800 - img.height * scale) / 2;
          ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
          
          const card = document.createElement('div');
          card.className = 'card';
          card.appendChild(canvas);
          
          const label = document.createElement('span');
          label.textContent = file.name;
          card.appendChild(label);
          
          previewGrid.appendChild(card);
          items.push(item);
          counter.textContent = `${items.length} wallpaper(s) ready`;
        };
        img.onerror = () => {
          console.error('Failed to load image:', file.name);
        };
        img.src = URL.createObjectURL(file);
      }
      fileInput.value = '';
    });
    
    console.log("App fully initialized - theme toggle and image loading ready!");
  </script>
</body>
</html>
